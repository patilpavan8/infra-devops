stages:
  - lint
  - build
  - deploy

variables:
  HELM_VERSION: "3.14.0"
  KUBECTL_VERSION: "1.29.0"
  KUBE_NAMESPACE: "default"
  RELEASE_NAME: "nginx"
  CHART_PATH: "helm/nginx"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  IMAGE_NAME: $CI_REGISTRY_IMAGE/nginx

.default_tools: &default_tools
  image: alpine:3.19
  before_script:
    - apk add --no-cache curl bash ca-certificates
    - curl -sSL https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz | tar -xz
    - mv linux-amd64/helm /usr/local/bin/helm
    - curl -sSL https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
    - chmod +x /usr/local/bin/kubectl

# -------------------------
# Helm lint
# -------------------------
helm_lint:
  <<: *default_tools
  stage: lint
  script:
    - helm lint ${CHART_PATH}
    - helm template ${RELEASE_NAME} ${CHART_PATH}
  rules:
    - if: $CI_COMMIT_BRANCH

# -------------------------
# Build container image
# -------------------------
build_image:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
    - docker push ${IMAGE_NAME}:${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH

# -------------------------
# Auto deploy to DEV
# -------------------------
deploy_dev:
  <<: *default_tools
  stage: deploy
  script:
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
    - helm upgrade --install ${RELEASE_NAME}-dev ${CHART_PATH} \
        --namespace ${KUBE_NAMESPACE} \
        --set image.repository=${IMAGE_NAME} \
        --set image.tag=${IMAGE_TAG} \
        -f ${CHART_PATH}/values-dev.yaml
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH != "main"

# -------------------------
# Manual production deploy
# -------------------------
deploy_prod:
  <<: *default_tools
  stage: deploy
  when: manual
  script:
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
    - helm upgrade --install ${RELEASE_NAME} ${CHART_PATH} \
        --namespace ${KUBE_NAMESPACE} \
        --set image.repository=${IMAGE_NAME} \
        --set image.tag=${IMAGE_TAG}
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
