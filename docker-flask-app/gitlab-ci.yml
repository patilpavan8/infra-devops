image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - test

before_script:
  - docker info

build_docker_image:
  stage: build
  script:
    - docker build -t flask-docker-app .

test_container:
  stage: test
  script:
    - docker run -d -p 5000:5000 --name flask_test flask-docker-app
    - sleep 5
    - docker ps
    - docker logs flask_test
    - docker rm -f flask_test
